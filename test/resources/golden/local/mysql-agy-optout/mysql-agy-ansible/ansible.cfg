[defaults]
interpreter_python = auto_silent
inventory = inventory.json
host_key_checking = False
retry_files_enabled = False
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -F /dev/null -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
