---
- name: Prepare every member to join
  hosts: mysql
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Ask this member what it can see of the group
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - >-
            SELECT COUNT(*) FROM performance_schema.replication_group_members
            WHERE MEMBER_STATE = 'ONLINE'
      register: gr_online
      changed_when: false

    - name: Ask whether this member has ever applied a transaction from the group
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - "SELECT GTID_SUBSET('<{ mysql-group-name }>:1', @@GLOBAL.gtid_executed)"
      register: gr_seen
      changed_when: false

    - name: Clear the binary log of a member that has never seen the group
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -e
          - RESET MASTER
      when:
        - gr_seen.stdout | trim == '0'
        - gr_online.stdout | trim == '0'
      changed_when: true

    - name: Create the replication account on every member
      ansible.builtin.shell: |
        set -euo pipefail
        esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g"; }
        pw=$(esc "$REPL_PASSWORD")
        mysql --protocol=socket --user=root <<SQL
        SET SESSION sql_log_bin = 0;
        CREATE USER IF NOT EXISTS '<{ mysql-replication-user }>'@'%' IDENTIFIED BY '${pw}';
        ALTER USER '<{ mysql-replication-user }>'@'%' IDENTIFIED BY '${pw}';
        GRANT REPLICATION SLAVE, REPLICATION CLIENT, BACKUP_ADMIN,
              CONNECTION_ADMIN, GROUP_REPLICATION_STREAM ON *.* TO '<{ mysql-replication-user }>'@'%';
        SET SESSION sql_log_bin = 1;
        SQL
      args:
        executable: /bin/bash
      environment:
        REPL_PASSWORD: "{{ (lookup('env', 'COLORS_PAR_MYSQL_REPLICATION_PASSWORD') | hash('sha256'))[:32] }}"
      no_log: true
      changed_when: true
      register: repl_account
      failed_when: false

    - name: Report why it failed
      ansible.builtin.fail:
        msg: "{{ repl_account.stderr | default(repl_account.msg) | default('failed') }}"
      when: repl_account is not skipped and (repl_account.rc | default(1)) != 0

    - name: Create the administrative account on every member
      ansible.builtin.shell: |
        set -euo pipefail
        esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g"; }
        pw=$(esc "$ADMIN_PASSWORD")
        mysql --protocol=socket --user=root <<SQL
        SET SESSION sql_log_bin = 0;
        CREATE USER IF NOT EXISTS '<{ mysql-admin-user }>'@'%' IDENTIFIED BY '${pw}';
        ALTER USER '<{ mysql-admin-user }>'@'%' IDENTIFIED BY '${pw}';
        GRANT ALL PRIVILEGES ON *.* TO '<{ mysql-admin-user }>'@'%' WITH GRANT OPTION;
        SET SESSION sql_log_bin = 1;
        SQL
      args:
        executable: /bin/bash
      environment:
        ADMIN_PASSWORD: "{{ lookup('env', 'COLORS_PAR_MYSQL_ADMIN_PASSWORD') }}"
      no_log: true
      changed_when: true
      register: admin_account
      failed_when: false

    - name: Report why it failed
      ansible.builtin.fail:
        msg: "{{ admin_account.stderr | default(admin_account.msg) | default('failed') }}"
      when: admin_account is not skipped and (admin_account.rc | default(1)) != 0

    - name: Point the distributed-recovery channel at the replication account
      when: gr_online.stdout | trim == '0'
      ansible.builtin.shell: |
        set -euo pipefail
        esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g"; }
        pw=$(esc "$REPL_PASSWORD")
        mysql --protocol=socket --user=root <<SQL
        CHANGE REPLICATION SOURCE TO
          SOURCE_USER = '<{ mysql-replication-user }>',
          SOURCE_PASSWORD = '${pw}'
          FOR CHANNEL 'group_replication_recovery';
        SQL
      args:
        executable: /bin/bash
      environment:
        REPL_PASSWORD: "{{ (lookup('env', 'COLORS_PAR_MYSQL_REPLICATION_PASSWORD') | hash('sha256'))[:32] }}"
      no_log: true
      changed_when: true
      register: recovery_channel
      failed_when: false

    - name: Report why it failed
      ansible.builtin.fail:
        msg: "{{ recovery_channel.stderr | default(recovery_channel.msg) | default('failed') }}"
      when: recovery_channel is not skipped and (recovery_channel.rc | default(1)) != 0

- name: Bootstrap the group, but only if there is no group
  hosts: bootstrap
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Add up what every member reported
      ansible.builtin.set_fact:
        cluster_online: >-
          {{ groups['mysql']
             | map('extract', hostvars, ['gr_online', 'stdout'])
             | map('trim') | map('int') | sum }}

    - name: Report the decision
      ansible.builtin.debug:
        msg: >-
          {{ ((cluster_online | int) == 0)
             | ternary('no member is ONLINE anywhere; bootstrapping',
                       'the group already exists; joining it') }}

    - name: Bootstrap
      ansible.builtin.shell: |
        set -euo pipefail
        mysql --protocol=socket --user=root <<'SQL'
        SET GLOBAL group_replication_bootstrap_group = ON;
        START GROUP_REPLICATION;
        SET GLOBAL group_replication_bootstrap_group = OFF;
        SQL
      args:
        executable: /bin/bash
      when: cluster_online | int == 0
      changed_when: true

- name: Bring every member into the group, one at a time
  hosts: mysql
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1

  tasks:
    - name: What state is this member in
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - >-
            SELECT COALESCE((SELECT MEMBER_STATE
                               FROM performance_schema.replication_group_members
                              WHERE MEMBER_ID = @@server_uuid), 'OFFLINE')
      register: member_state
      changed_when: false

    - name: Start group replication
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -e
          - START GROUP_REPLICATION
      register: start_gr
      when: member_state.stdout | trim != 'ONLINE'
      changed_when: start_gr.rc == 0
      failed_when:
        - start_gr.rc != 0
        - "'already running' not in (start_gr.stderr | default(''))"

    - name: Wait for this member to come ONLINE
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - >-
            SELECT COALESCE((SELECT MEMBER_STATE
                               FROM performance_schema.replication_group_members
                              WHERE MEMBER_ID = @@server_uuid), 'OFFLINE')
      register: joined
      until: joined.stdout | trim == 'ONLINE'
      retries: 60
      delay: 5
      changed_when: false

- name: Create the operational schema on whichever member is primary
  hosts: mysql
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Which role does this member hold
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - >-
            SELECT MEMBER_ROLE FROM performance_schema.replication_group_members
            WHERE MEMBER_ID = @@server_uuid
      register: member_role
      changed_when: false

    - name: Create the heartbeat schema
      ansible.builtin.shell: |
        set -euo pipefail
        mysql --protocol=socket --user=root <<'SQL'
        CREATE DATABASE IF NOT EXISTS mysql_agy;
        CREATE TABLE IF NOT EXISTS mysql_agy.heartbeat (
          id   TINYINT UNSIGNED NOT NULL PRIMARY KEY,
          ts   DATETIME(6)      NOT NULL,
          node VARCHAR(64)      NOT NULL
        ) ENGINE = InnoDB;
        CREATE TABLE IF NOT EXISTS mysql_agy.beat_log (
          id   BIGINT UNSIGNED  NOT NULL AUTO_INCREMENT PRIMARY KEY,
          ts   DATETIME(6)      NOT NULL,
          node VARCHAR(64)      NOT NULL,
          KEY beat_log_ts (ts)
        ) ENGINE = InnoDB;
        INSERT IGNORE INTO mysql_agy.heartbeat (id, ts, node)
          VALUES (1, NOW(6), 'bootstrap');
        SQL
      args:
        executable: /bin/bash
      when: member_role.stdout | trim == 'PRIMARY'
      changed_when: true

- name: Let a rebooted member rejoin by itself
  hosts: mysql
  become: true
  gather_facts: false

  tasks:
    - name: Enable start-on-boot now that the group exists
      ansible.builtin.copy:
        dest: /etc/mysql/mysql.conf.d/zz-colors-ha-boot.cnf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Colors mysql-agy.
          [mysqld]
          group_replication_start_on_boot = ON

- name: Confirm the whole group is up
  hosts: bootstrap
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Every member ONLINE
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - >-
            SELECT COUNT(*) FROM performance_schema.replication_group_members
            WHERE MEMBER_STATE = 'ONLINE'
      register: group_size
      until: group_size.stdout | trim == '<{ node-count }>'
      retries: 60
      delay: 5
      changed_when: false

    - name: Exactly one primary
      ansible.builtin.command:
        argv:
          - mysql
          - --protocol=socket
          - --user=root
          - -N
          - -B
          - -e
          - >-
            SELECT COUNT(*) FROM performance_schema.replication_group_members
            WHERE MEMBER_STATE = 'ONLINE' AND MEMBER_ROLE = 'PRIMARY'
      register: primary_count
      until: primary_count.stdout | trim == '1'
      retries: 30
      delay: 5
      changed_when: false
